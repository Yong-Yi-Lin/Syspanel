<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <script src="./js/jquery-1.11.3.min.js"></script>
    <script type="text/javascript" src="./js/bootstrap.js"></script>
    <script type="text/javascript">
        $(document).ready(function() {
                $("#findUser").click(function () {
                    var str = $("#search_form").serializeArray();
                    var username = str[0].value;
                    if (username == "") {
                        alert("请输入用户名查找");
                        return false;
                    }
                    $.ajax({
                        type: "GET",
                        url: 'user/getUser/' + username,
                        contentType: "application/x-www-form-urlencoded",
                        success: function (result) { //返回JSON对象，但JSON对象下的属性无法再识别是否为对象，均为字符串
                            if (result.code === 2000) {
                                alert(result.message +
                                    "  用户名：" + result.data.userName +
                                    "  真实姓名：" + result.data.realName);
                            } else {
                                alert(result.message);
                            }
                        }
                    });
                })
        });
    </script>
</head>
<body>
<div>
    <form id="search_form">
        <input type="text" placeholder="请输入用户名" name="username" id="username">
        <input type="button" id="findUser" value="查询用户">
    </form>
</div>
</body>
</html>
